# Copier template for an LLM-wiki instance — see README.md and CONCEPT.md §6
_subdirectory: template
_min_copier_version: "9.0.0"
_answers_file: .copier-answers.yml

# Instance ownership: only created on the first copy, never overwritten on update
_skip_if_exists:
  - CLAUDE.md
  - wiki.config.yaml
  - .gitignore
  - wiki/index.md
  - wiki/log.md
  - wiki/overview.md

# Data migrations per concept version (run on `copier update` when a version is skipped past).
_migrations:
  - version: v0.4.0
    when: "{{ _stage == 'after' }}"
    command: python3 .llm-wiki/migrations/0001_status_en.py

wiki_name:
  type: str
  help: "Name of the wiki (e.g. 'Work Wiki', 'Personal Wiki', 'Project X')"

wiki_purpose:
  type: str
  help: "Purpose in one sentence — whose knowledge, for what?"

owner_name:
  type: str
  help: "Your name (for commits and CLAUDE.md)"

git_email:
  type: str
  help: "Email for commits in this wiki"

language:
  type: str
  choices: [de, en]
  default: en
  help: "Content language for this instance's own pages (not yet wired into the template — informational for now)"

extra_source_prefixes:
  type: str
  default: ""
  help: "Additional source prefixes, comma-separated (e.g. 'confluence, jira, notion'). Core prefixes raw/ wiki/ scripts/ url: meeting: note: are always included."

sensitive_data_note:
  type: str
  default: "raw/ stays local (gitignored)."
  help: "What must not go into the repo / the wiki? (compliance note for CLAUDE.md)"
